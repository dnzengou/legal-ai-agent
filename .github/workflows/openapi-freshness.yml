name: openapi-freshness
on:
  pull_request:
    paths:
      - 'api/**'
      - 'src/**'
      - 'site/openapi.json'
      - 'scripts/generate_openapi.py'
      - '.github/workflows/openapi-freshness.yml'
  push:
    branches: [main]
    paths:
      - 'api/**'
      - 'src/**'
      - 'site/openapi.json'
      - 'scripts/generate_openapi.py'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install
        run: |
          pip install -r requirements.txt

      - name: Regenerate OpenAPI snapshot
        env:
          ANTHROPIC_API_KEY: dummy
        run: |
          python scripts/generate_openapi.py
          echo "::group::Diff against committed snapshot"
          git diff --exit-code site/openapi.json || {
            echo "::endgroup::"
            echo "::error::site/openapi.json is out of date. Run scripts/generate_openapi.py and commit the result."
            exit 1
          }
          echo "::endgroup::"
          echo "openapi.json is in sync with the live API shape."
