<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="112" fill="#080f1a"/>
  <rect width="512" height="512" rx="112" fill="url(#bg)" opacity="0.6"/>
  <defs>
    <radialGradient id="bg" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#002B52"/>
      <stop offset="100%" stop-color="#00050A"/>
    </radialGradient>
    <linearGradient id="teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00DFDF"/>
      <stop offset="100%" stop-color="#00909A"/>
    </linearGradient>
  </defs>
  <!-- Scale base pole -->
  <rect x="251" y="155" width="10" height="200" rx="5" fill="url(#teal)"/>
  <!-- Scale base -->
  <rect x="176" y="350" width="160" height="12" rx="6" fill="url(#teal)"/>
  <rect x="222" y="362" width="68" height="18" rx="5" fill="url(#teal)" opacity="0.6"/>
  <!-- Scale beam -->
  <rect x="156" y="168" width="200" height="8" rx="4" fill="url(#teal)"/>
  <!-- Left pan chain -->
  <line x1="180" y1="176" x2="168" y2="240" stroke="#00BFBF" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
  <!-- Right pan chain -->
  <line x1="332" y1="176" x2="344" y2="240" stroke="#00BFBF" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
  <!-- Left pan -->
  <ellipse cx="168" cy="248" rx="42" ry="14" fill="none" stroke="url(#teal)" stroke-width="5"/>
  <!-- Right pan -->
  <ellipse cx="344" cy="248" rx="42" ry="14" fill="none" stroke="url(#teal)" stroke-width="5"/>
  <!-- Top center ornament -->
  <circle cx="256" cy="164" r="10" fill="url(#teal)"/>
  <!-- Glow dot -->
  <circle cx="256" cy="164" r="16" fill="url(#teal)" opacity="0.15"/>
</svg>
